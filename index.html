<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#EFEDE6;
    --paper-2:#E6E2D6;
    --ink:#1B2B24;
    --ink-soft:#3E4A44;
    --ledger-green:#2F6F4E;
    --ledger-green-dark:#20503A;
    --brick:#B3402A;
    --rule:#C9C3B4;
    --brass:#B08D57;
    --white:#FBFAF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  /* ---------- Header ---------- */
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:26px;
    flex-wrap:wrap;
    gap:16px;
  }
  .masthead h1{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0;
    letter-spacing:0.2px;
  }
  .masthead .sub{
    font-size:0.78rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-top:4px;
  }
  .today-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    color:var(--ink-soft);
    text-align:right;
  }

  /* ---------- Summary strip ---------- */
  .summary-row{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin-bottom:28px;
  }
  .summary-card{
    background:var(--white);
    border:1px solid var(--rule);
    padding:16px 20px;
    position:relative;
    flex:0 1 320px;
    min-width:220px;
  }
  .summary-card .label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .summary-card .value{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.7rem;
    font-weight:600;
    color:var(--ink);
  }

  /* Signature stamp */
  .stamp{
    position:absolute;
    top:12px;
    right:16px;
    border:2px solid currentColor;
    padding:5px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.5px;
    transform:rotate(-4deg);
    border-radius:3px;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .stamp::before{
    content:"";
    position:absolute;
    inset:2px;
    border:1px solid currentColor;
    border-radius:2px;
    opacity:0.5;
  }
  .stamp.up{ color:var(--brick); }
  .stamp.down{ color:var(--ledger-green); }
  .stamp.flat{ color:var(--ink-soft); }

  /* ---------- Section headers ---------- */
  .section{
    margin-bottom:34px;
  }
  .section h2{
    font-family:'Zilla Slab',serif;
    font-size:1.2rem;
    font-weight:600;
    margin:0 0 14px 0;
    padding-bottom:8px;
    border-bottom:1px solid var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .section h2 .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    font-weight:400;
    color:var(--ink-soft);
  }

  /* ---------- Entry form ---------- */
  .entry-form{
    background:var(--white);
    border:1px solid var(--rule);
    padding:18px;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1.3fr auto;
    gap:12px;
    align-items:end;
  }
  .entry-form .field{ min-width:0; }
  .field label{
    display:block;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    padding:8px 9px;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
    border-radius:3px;
  }
  .field input:focus, .field select:focus, button:focus-visible{
    outline:2px solid var(--ledger-green);
    outline-offset:1px;
  }
  .amount-field input{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    padding:9px 16px;
    border:none;
    border-radius:3px;
    cursor:pointer;
    background:var(--ledger-green);
    color:var(--white);
    transition:background 0.15s ease;
  }
  .btn:hover{ background:var(--ledger-green-dark); }
  .btn.secondary{
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink);
  }
  .btn.secondary:hover{ background:var(--paper-2); }
  .btn.small{ padding:5px 10px; font-size:0.72rem; }
  .form-error{
    grid-column:1/-1;
    color:var(--brick);
    font-size:0.78rem;
    display:none;
  }

  /* ---------- Category manager ---------- */
  .cat-manager{
    margin-top:12px;
  }
  .cat-toggle{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:0.75rem;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .cat-panel{
    display:none;
    margin-top:12px;
    background:var(--white);
    border:1px solid var(--rule);
    padding:14px;
  }
  .cat-panel.open{ display:block; }
  .cat-chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .cat-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:5px 10px;
    font-size:0.78rem;
  }
  .cat-chip button{
    background:none;
    border:none;
    color:var(--brick);
    cursor:pointer;
    font-weight:700;
    font-size:0.85rem;
    line-height:1;
    padding:0;
  }
  .cat-add-row{
    display:flex;
    gap:8px;
  }
  .cat-add-row input{
    flex:1;
    padding:7px 9px;
    border:1px solid var(--rule);
    border-radius:3px;
    font-family:'Inter',sans-serif;
    background:var(--paper);
  }

  /* ---------- Filter chips ---------- */
  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }

  /* ---------- Month tabs (spreadsheet-style) ---------- */
  .month-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:0;
  }
  .month-tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    font-weight:500;
    padding:8px 16px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-bottom:none;
    border-radius:6px 6px 0 0;
    color:var(--ink-soft);
    cursor:pointer;
    position:relative;
    top:2px;
  }
  .month-tab:hover{
    background:var(--white);
    color:var(--ink);
  }
  .month-tab.active{
    background:var(--white);
    color:var(--ink);
    font-weight:600;
    border-color:var(--ink);
    border-bottom:2px solid var(--white);
  }
  .filter-chip{
    font-family:'Inter',sans-serif;
    font-size:0.78rem;
    padding:6px 13px;
    border:1px solid var(--ink-soft);
    border-radius:14px;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--ink);
    color:var(--white);
    border-color:var(--ink);
  }

  /* ---------- Table ---------- */
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--white);
  }
  thead th{
    text-align:left;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    padding:10px 12px;
    border-bottom:2px solid var(--ink);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th.num, tbody td.num{ text-align:right; }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--rule);
    font-size:0.88rem;
  }
  tbody td.num{
    font-family:'IBM Plex Mono',monospace;
  }
  tbody tr:hover{ background:var(--paper-2); }
  .cat-tag{
    display:inline-block;
    font-size:0.72rem;
    padding:2px 8px;
    border-radius:10px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    color:var(--ink-soft);
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--brick);
    cursor:pointer;
    font-size:0.95rem;
    padding:2px 6px;
  }
  .empty-row td{
    text-align:center;
    color:var(--ink-soft);
    font-style:italic;
    padding:26px;
  }

  /* ---------- Chart ---------- */
  .chart-box{
    background:var(--white);
    border:1px solid var(--rule);
    padding:20px;
  }
  .chart-box canvas{ max-height:280px; }

  /* ---------- Entries table scroll wrapper ---------- */
  .table-scroll{
    overflow-x:auto;
    background:var(--white);
  }
  .table-scroll table{ min-width:520px; }

  /* ---------- Pivot table ---------- */
  .pivot-wrap{
    overflow-x:auto;
    background:var(--white);
    border:1px solid var(--rule);
  }
  .pivot-wrap table{ min-width:600px; }
  .pivot-wrap td.total-cell, .pivot-wrap th.total-col{
    font-weight:600;
    border-left:1px solid var(--ink);
    background:var(--paper-2);
  }
  .pivot-wrap tr.total-row td{
    font-weight:600;
    border-top:2px solid var(--ink);
    background:var(--paper-2);
  }

  /* ---------- MoM comparison ---------- */
  #momWrap{ overflow-x:auto; }
  .mom-table{ min-width:480px; }
  .mom-table td.diff-up{ color:var(--brick); font-weight:600; }
  .mom-table td.diff-down{ color:var(--ledger-green); font-weight:600; }
  .mom-table td.diff-flat{ color:var(--ink-soft); }
  .arrow{ font-size:0.75em; margin-right:2px; }

  .placeholder-note{
    font-size:0.85rem;
    color:var(--ink-soft);
    font-style:italic;
    padding:16px;
    background:var(--white);
    border:1px solid var(--rule);
  }

  @media (max-width:720px){
    .entry-form{ grid-template-columns:1fr; }
    .entry-form .btn{ grid-column:1/-1; }
    .summary-card{ flex-basis:100%; }

    /* Entries table becomes a stack of cards — no horizontal scrolling */
    .table-scroll{ overflow-x:visible; }
    .table-scroll table{ min-width:0; width:100%; border-collapse:separate; border-spacing:0; }
    .table-scroll thead{ display:none; }
    .table-scroll tbody tr{
      display:flex;
      flex-wrap:wrap;
      border:1px solid var(--rule);
      border-radius:4px;
      margin-bottom:10px;
      padding:10px 12px;
      background:var(--white);
    }
    .table-scroll tbody tr:hover{ background:var(--white); }
    .table-scroll tbody tr.empty-row{ display:block; border:none; padding:0; }
    .table-scroll td{
      border:none;
      padding:2px 0;
      font-size:0.85rem;
    }
    .table-scroll td.cell-name{ flex:1 1 60%; order:1; font-weight:600; }
    .table-scroll td.cell-amount{ flex:1 1 40%; order:2; text-align:right; font-weight:600; }
    .table-scroll td.cell-date{ flex:1 1 60%; order:3; font-size:0.78rem; color:var(--ink-soft); }
    .table-scroll td.cell-category{ flex:1 1 40%; order:4; text-align:right; }
    .table-scroll td.cell-actions{
      order:5;
      flex:1 1 100%;
      text-align:right;
      padding-top:6px;
      margin-top:4px;
      border-top:1px solid var(--rule);
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Daily Ledger</h1>
      <div class="sub">A running record of what goes out</div>
    </div>
    <div class="today-tag" id="todayTag"></div>
  </div>

  <div class="summary-row" id="summaryRow">
    <div class="summary-card" id="monthCard">
      <div class="label" id="monthTotalLabel">Total spent this month</div>
      <div class="value" id="totalThisMonth">$0.00</div>
      <div class="stamp flat" id="momStamp" style="display:none;"></div>
    </div>
    <div class="summary-card" id="categoryTotalCard" style="display:none;">
      <div class="label" id="categoryTotalLabel">Category total</div>
      <div class="value" id="categoryTotalValue">$0.00</div>
    </div>
  </div>

  <div class="section">
    <h2>Add an entry</h2>
    <form class="entry-form" id="entryForm" novalidate>
      <div class="field">
        <label for="f-name">Expense name</label>
        <input type="text" id="f-name" placeholder="e.g. Groceries at Trader Joe's">
      </div>
      <div class="field amount-field">
        <label for="f-amount">Amount</label>
        <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="field">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-category">Category</label>
        <select id="f-category"></select>
      </div>
      <button type="submit" class="btn">Add entry</button>
      <div class="form-error" id="formError"></div>
    </form>
    <div class="cat-manager">
      <button class="cat-toggle" id="catToggle">Manage categories</button>
      <span style="color:var(--rule); margin:0 8px;">·</span>
      <button class="cat-toggle" id="loadSampleBtn">Load sample data</button>
      <span style="color:var(--rule); margin:0 8px;">·</span>
      <button class="cat-toggle" id="exportBtn">Export data</button>
      <span style="color:var(--rule); margin:0 8px;">·</span>
      <button class="cat-toggle" id="importBtn">Import data</button>
      <span style="color:var(--rule); margin:0 8px;">·</span>
      <button class="cat-toggle" id="exportCsvBtn">Export to CSV (for Excel/Sheets)</button>
      <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">
      <div class="cat-panel" id="catPanel">
        <div class="cat-chip-row" id="catChipRow"></div>
        <div class="cat-add-row">
          <input type="text" id="newCatInput" placeholder="New category name">
          <button class="btn small" id="addCatBtn">Add category</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Entries <span class="count" id="entryCount"></span></h2>
    <div class="month-tabs" id="monthTabs"></div>
    <div class="filter-row" id="filterRow"></div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-sort="date">Date ↕</th>
            <th data-sort="name">Expense</th>
            <th data-sort="category">Category</th>
            <th class="num" data-sort="amount">Amount ↕</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="entryBody"></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2>Monthly spend</h2>
    <div class="chart-box">
      <div class="placeholder-note" id="chartPlaceholder" style="display:none;border:none;padding:0;"></div>
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>

  <div class="section">
    <h2 id="categoryHeader">Category breakdown</h2>
    <div class="placeholder-note" id="pivotPlaceholder" style="display:none;"></div>
    <div class="pivot-wrap" id="pivotWrap">
      <table id="pivotTable"></table>
    </div>
  </div>

  <div class="section">
    <h2 id="momHeader">Month over month</h2>
    <div id="momWrap"></div>
  </div>

</div>

<script>
(function(){

  // ---------- Error surfacing ----------
  // If anything throws, show it on-screen instead of failing silently,
  // so we can see exactly what's going wrong instead of guessing.
  function showErrorBanner(message){
    let banner = document.getElementById('errorBanner');
    if(!banner){
      banner = document.createElement('div');
      banner.id = 'errorBanner';
      banner.style.cssText = 'position:sticky;top:0;z-index:9999;background:#B3402A;color:#fff;padding:12px 18px;font-family:monospace;font-size:13px;white-space:pre-wrap;border-bottom:3px solid #7a2a1c;';
      document.body.prepend(banner);
    }
    banner.textContent = 'Something went wrong: ' + message;
  }
  window.addEventListener('error', (ev) => {
    showErrorBanner((ev.error && ev.error.message) || ev.message || 'Unknown error');
  });
  window.addEventListener('unhandledrejection', (ev) => {
    showErrorBanner((ev.reason && ev.reason.message) || String(ev.reason) || 'Unknown promise rejection');
  });

  // ---------- State ----------
  let expenses = [];
  let categories = ["Food","Transport","Shopping","Bills","Entertainment","Health","Other"];
  let activeFilter = "All";
  let activeMonth = "All";
  let sortKey = "date";
  let sortDir = "desc";
  let chartInstance = null;
  // Tracks true add-order (not just calendar date) so that when two entries
  // share the same date, the more recently added one can still be shown
  // first — matching the "most recent first" pattern used everywhere else.
  let nextSeq = 1;

  const $ = (id) => document.getElementById(id);
  const fmtMoney = (n) => "$" + (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const todayStr = () => new Date().toISOString().slice(0,10);
  const monthKey = (dateStr) => dateStr ? dateStr.slice(0,7) : "";
  const monthLabel = (key) => {
    const [y,m] = key.split("-");
    const d = new Date(parseInt(y), parseInt(m)-1, 1);
    return d.toLocaleDateString('en-US',{month:'short', year:'numeric'});
  };
  const shiftMonth = (key, delta) => {
    const [y,m] = key.split("-").map(Number);
    const d = new Date(y, (m-1)+delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  };
  // The "reference month" is whichever month the detail sections (summary,
  // category breakdown, month-over-month) key off of. It follows the active
  // month tab; when "All months" is selected, it falls back to the most
  // recent month that has data (or the real current month if there's no data at all).
  function getReferenceMonth(){
    if(activeMonth !== "All") return activeMonth;
    const monthSet = {};
    expenses.forEach(e => { const k = monthKey(e.date); if(k) monthSet[k] = true; });
    const months = Object.keys(monthSet).sort();
    return months.length ? months[months.length-1] : monthKey(todayStr());
  }

  // ---------- Storage ----------
  // When opened inside Claude's file viewer, window.storage exists and
  // auto-saves per this file/account. When opened as a plain downloaded
  // file in a regular browser, window.storage isn't available, so we
  // fall back to the browser's own localStorage — still fully automatic,
  // just scoped to that one file + browser instead of your Claude account.
  const hasClaudeStorage = (typeof window !== 'undefined')
    && window.storage
    && typeof window.storage.get === 'function'
    && typeof window.storage.set === 'function';

  const STORAGE_PREFIX = 'daily-ledger:';

  const storage = {
    async get(key){
      if(hasClaudeStorage){
        try{ return await window.storage.get(key); }
        catch(err){ return null; }
      }
      try{
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        return raw === null ? null : { key, value: raw };
      }catch(err){ return null; }
    },
    async set(key, value){
      if(hasClaudeStorage){
        try{ return await window.storage.set(key, value); }
        catch(err){ console.error('Could not save', key, err); return null; }
      }
      try{
        localStorage.setItem(STORAGE_PREFIX + key, value);
        return { key, value };
      }catch(err){ console.error('Could not save', key, err); return null; }
    }
  };

  async function loadState(){
    try{
      const e = await storage.get('expenses');
      if(e && e.value) expenses = JSON.parse(e.value);
    }catch(err){ expenses = []; }
    try{
      const c = await storage.get('categories');
      if(c && c.value) categories = JSON.parse(c.value);
    }catch(err){ /* keep defaults */ }
    // Resume the add-order counter above whatever's already been used,
    // so newly added entries always sort after existing ones.
    const maxSeq = expenses.reduce((m, e) => Math.max(m, e.seq || 0), 0);
    nextSeq = maxSeq + 1;
  }
  async function saveExpenses(){
    await storage.set('expenses', JSON.stringify(expenses));
  }
  async function saveCategories(){
    await storage.set('categories', JSON.stringify(categories));
  }

  // ---------- Rendering: form / categories ----------
  function renderCategoryOptions(){
    const sel = $('f-category');
    const prev = sel.value;
    sel.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if(categories.includes(prev)) sel.value = prev;
  }

  function renderCategoryChips(){
    const row = $('catChipRow');
    row.innerHTML = categories.map(c => {
      const inUse = expenses.some(e => e.category === c);
      return `<span class="cat-chip" data-cat="${escapeHtml(c)}">
        ${escapeHtml(c)}
        <button data-action="del-cat" data-cat="${escapeHtml(c)}" title="${inUse ? 'In use — reassign entries first' : 'Remove category'}">×</button>
      </span>`;
    }).join('');
  }

  function renderFilterChips(){
    const row = $('filterRow');
    const cats = ["All", ...categories];
    row.innerHTML = cats.map(c =>
      `<button class="filter-chip ${c===activeFilter?'active':''}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');
  }

  function renderMonthTabs(){
    const tabsRow = $('monthTabs');
    const monthSet = {};
    expenses.forEach(e => { const k = monthKey(e.date); if(k) monthSet[k] = true; });
    const months = Object.keys(monthSet).sort(); // oldest to newest
    // reset if the currently active month no longer has any data
    if(activeMonth !== "All" && !months.includes(activeMonth)) activeMonth = "All";

    if(months.length === 0){
      tabsRow.innerHTML = '';
      return;
    }

    const tabs = ["All", ...months];
    tabsRow.innerHTML = tabs.map(m => {
      const label = m === "All" ? "All months" : monthLabel(m);
      return `<button class="month-tab ${m===activeMonth?'active':''}" data-month="${escapeHtml(m)}">${escapeHtml(label)}</button>`;
    }).join('');
  }

  // ---------- Rendering: entries table ----------
  function getFiltered(){
    let list = expenses.slice();
    if(activeMonth !== "All") list = list.filter(e => monthKey(e.date) === activeMonth);
    if(activeFilter !== "All") list = list.filter(e => e.category === activeFilter);
    list.sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if(sortKey === 'amount'){ av = parseFloat(av); bv = parseFloat(bv); }
      if(av < bv) return sortDir === 'asc' ? -1 : 1;
      if(av > bv) return sortDir === 'asc' ? 1 : -1;
      // Tie-break: show the more recently added entry first (e.g. two
      // expenses logged on the same date), regardless of which column
      // is currently sorted.
      return (b.seq || 0) - (a.seq || 0);
    });
    return list;
  }

  function renderTable(){
    const list = getFiltered();
    $('entryCount').textContent = `(${list.length})`;
    const body = $('entryBody');
    if(list.length === 0){
      body.innerHTML = `<tr class="empty-row"><td colspan="5">No entries yet. Add your first expense above.</td></tr>`;
      return;
    }
    body.innerHTML = list.map(e => `
      <tr>
        <td class="cell-date">${formatDateDisplay(e.date)}</td>
        <td class="cell-name">${escapeHtml(e.name)}</td>
        <td class="cell-category"><span class="cat-tag">${escapeHtml(e.category)}</span></td>
        <td class="num cell-amount">${fmtMoney(e.amount)}</td>
        <td class="cell-actions"><button class="del-btn" data-action="del-expense" data-id="${e.id}" title="Delete entry">✕</button></td>
      </tr>
    `).join('');
  }

  function formatDateDisplay(dateStr){
    if(!dateStr) return "";
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
  }

  // ---------- Summary ----------
  function renderSummary(){
    const refKey = getReferenceMonth();
    const prevKey = shiftMonth(refKey, -1);

    const curTotal = expenses.filter(e => monthKey(e.date) === refKey).reduce((s,e)=>s+parseFloat(e.amount),0);
    const prevTotal = expenses.filter(e => monthKey(e.date) === prevKey).reduce((s,e)=>s+parseFloat(e.amount),0);

    $('monthTotalLabel').textContent = `Total spent — ${monthLabel(refKey)}`;
    $('totalThisMonth').textContent = fmtMoney(curTotal);

    const stamp = $('momStamp');
    if(prevTotal > 0){
      const diff = curTotal - prevTotal;
      const pct = (diff/prevTotal)*100;
      stamp.style.display = 'flex';
      if(Math.abs(pct) < 0.5){
        stamp.className = 'stamp flat';
        stamp.textContent = `● flat vs ${monthLabel(prevKey)}`;
      } else if(diff > 0){
        stamp.className = 'stamp up';
        stamp.innerHTML = `<span class="arrow">▲</span> ${pct.toFixed(1)}% vs ${monthLabel(prevKey)}`;
      } else {
        stamp.className = 'stamp down';
        stamp.innerHTML = `<span class="arrow">▼</span> ${Math.abs(pct).toFixed(1)}% vs ${monthLabel(prevKey)}`;
      }
    } else {
      stamp.style.display = 'none';
    }
  }

  // Shows a second card with the total for the currently selected category,
  // scoped to whichever month tab is active — i.e. the total of whatever
  // is currently shown in the entries table below.
  function renderCategoryTotal(){
    const card = $('categoryTotalCard');
    if(activeFilter === 'All'){
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';
    const list = getFiltered();
    const total = list.reduce((s,e) => s + parseFloat(e.amount), 0);
    const monthPart = activeMonth === 'All' ? 'all months' : monthLabel(activeMonth);
    $('categoryTotalLabel').textContent = `${activeFilter} total — ${monthPart}`;
    $('categoryTotalValue').textContent = fmtMoney(total);
  }

  // ---------- Chart ----------
  function renderChart(){
    const placeholder = $('chartPlaceholder');
    const canvas = $('monthlyChart');

    const byMonth = {};
    expenses.forEach(e => {
      const k = monthKey(e.date);
      if(!k) return;
      byMonth[k] = (byMonth[k] || 0) + parseFloat(e.amount);
    });
    const keys = Object.keys(byMonth).sort();
    const labels = keys.map(monthLabel);
    const data = keys.map(k => Math.round(byMonth[k]*100)/100);

    if(keys.length === 0){
      canvas.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.textContent = 'Add a few entries to see your monthly trend here.';
      if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
      return;
    }

    if(typeof Chart === 'undefined'){
      canvas.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.textContent = 'The chart library could not load, so the trend graph is unavailable right now — your data is still saved.';
      return;
    }

    canvas.style.display = 'block';
    placeholder.style.display = 'none';

    const ctx = canvas.getContext('2d');
    if(chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Total spent',
          data,
          backgroundColor: '#2F6F4E',
          borderRadius: 3,
          maxBarThickness: 48
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => fmtMoney(ctx.parsed.y)
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { callback: (v) => '$' + v.toLocaleString('en-US') },
            grid: { color: '#C9C3B4' }
          },
          x: {
            grid: { display: false }
          }
        }
      }
    });
  }

  // ---------- Pivot table ----------
  function renderPivot(){
    const table = $('pivotTable');
    const pivotWrap = $('pivotWrap');
    const placeholder = $('pivotPlaceholder');
    const header = $('categoryHeader');

    const refKey = getReferenceMonth();
    header.textContent = `Category breakdown — ${monthLabel(refKey)}`;

    const monthExpenses = expenses.filter(e => monthKey(e.date) === refKey);

    if(monthExpenses.length === 0){
      pivotWrap.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.textContent = `No entries for ${monthLabel(refKey)} yet.`;
      return;
    }

    pivotWrap.style.display = 'block';
    placeholder.style.display = 'none';

    const sums = {};
    monthExpenses.forEach(e => { sums[e.category] = (sums[e.category] || 0) + parseFloat(e.amount); });

    // sort categories by amount spent, highest first
    const catList = Object.keys(sums).sort((a,b) => sums[b] - sums[a]);
    const grandTotal = catList.reduce((s,c) => s + sums[c], 0);

    let html = '<thead><tr><th>Category</th><th class="num">Amount</th><th class="num total-col">% of month</th></tr></thead><tbody>';
    catList.forEach(c => {
      const v = sums[c];
      const pct = grandTotal > 0 ? (v/grandTotal)*100 : 0;
      html += `<tr><td>${escapeHtml(c)}</td><td class="num">${fmtMoney(v)}</td><td class="num total-cell">${pct.toFixed(1)}%</td></tr>`;
    });
    html += `<tr class="total-row"><td>Total</td><td class="num">${fmtMoney(grandTotal)}</td><td class="num total-cell">100.0%</td></tr>`;
    html += '</tbody>';

    table.innerHTML = html;
  }

  // ---------- Month-over-month comparison ----------
  function renderMoM(){
    const wrap = $('momWrap');
    const header = $('momHeader');

    const curKey = getReferenceMonth();
    const prevKey = shiftMonth(curKey, -1);

    header.textContent = `Month over month — ${monthLabel(prevKey)} vs ${monthLabel(curKey)}`;

    const curExists = expenses.some(e => monthKey(e.date) === curKey);
    const prevExists = expenses.some(e => monthKey(e.date) === prevKey);

    if(!curExists && !prevExists){
      wrap.innerHTML = `<div class="placeholder-note">No entries in ${monthLabel(prevKey)} or ${monthLabel(curKey)} yet.</div>`;
      return;
    }

    const sums = (key) => {
      const out = {};
      categories.forEach(c => out[c] = 0);
      expenses.filter(e => monthKey(e.date) === key).forEach(e => {
        out[e.category] = (out[e.category] || 0) + parseFloat(e.amount);
      });
      return out;
    };
    const curSums = sums(curKey);
    const prevSums = sums(prevKey);

    const allCats = Array.from(new Set([...Object.keys(curSums), ...Object.keys(prevSums)]));

    let html = `<table class="mom-table"><thead><tr>
      <th>Category</th>
      <th class="num">${monthLabel(prevKey)}</th>
      <th class="num">${monthLabel(curKey)}</th>
      <th class="num">Change ($)</th>
      <th class="num">Change (%)</th>
    </tr></thead><tbody>`;

    let curTotal = 0, prevTotal = 0;
    allCats.forEach(c => {
      const cur = curSums[c] || 0;
      const prev = prevSums[c] || 0;
      curTotal += cur; prevTotal += prev;
      if(cur === 0 && prev === 0) return;
      const diff = cur - prev;
      const pct = prev > 0 ? (diff/prev)*100 : (cur > 0 ? 100 : 0);
      const cls = Math.abs(diff) < 0.005 ? 'diff-flat' : (diff > 0 ? 'diff-up' : 'diff-down');
      const arrow = Math.abs(diff) < 0.005 ? '●' : (diff > 0 ? '▲' : '▼');
      html += `<tr>
        <td>${escapeHtml(c)}</td>
        <td class="num">${fmtMoney(prev)}</td>
        <td class="num">${fmtMoney(cur)}</td>
        <td class="num ${cls}">${diff>=0?'+':''}${fmtMoney(diff)}</td>
        <td class="num ${cls}"><span class="arrow">${arrow}</span>${prev>0 ? Math.abs(pct).toFixed(1)+'%' : '—'}</td>
      </tr>`;
    });

    const totalDiff = curTotal - prevTotal;
    const totalPct = prevTotal > 0 ? (totalDiff/prevTotal)*100 : 0;
    const totalCls = Math.abs(totalDiff) < 0.005 ? 'diff-flat' : (totalDiff > 0 ? 'diff-up' : 'diff-down');
    const totalArrow = Math.abs(totalDiff) < 0.005 ? '●' : (totalDiff > 0 ? '▲' : '▼');

    html += `<tr class="total-row" style="font-weight:600;border-top:2px solid var(--ink);">
      <td>Total</td>
      <td class="num">${fmtMoney(prevTotal)}</td>
      <td class="num">${fmtMoney(curTotal)}</td>
      <td class="num ${totalCls}">${totalDiff>=0?'+':''}${fmtMoney(totalDiff)}</td>
      <td class="num ${totalCls}"><span class="arrow">${totalArrow}</span>${prevTotal>0 ? Math.abs(totalPct).toFixed(1)+'%' : '—'}</td>
    </tr>`;

    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  // ---------- Render all ----------
  function renderAll(){
    renderCategoryOptions();
    renderCategoryChips();
    renderMonthTabs();
    renderFilterChips();
    renderTable();
    renderSummary();
    renderCategoryTotal();
    renderChart();
    renderPivot();
    renderMoM();
  }

  // ---------- Helpers ----------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (m) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  // ---------- Event wiring ----------
  function wireEvents(){
    $('todayTag').textContent = new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
    $('f-date').value = todayStr();

    $('entryForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const name = $('f-name').value.trim();
      const amount = parseFloat($('f-amount').value);
      const date = $('f-date').value;
      const category = $('f-category').value;
      const errBox = $('formError');

      if(!name || isNaN(amount) || amount <= 0 || !date || !category){
        errBox.textContent = 'Please fill in a name, a positive amount, a date, and a category.';
        errBox.style.display = 'block';
        return;
      }
      errBox.style.display = 'none';

      expenses.push({ id: uid(), name, amount, date, category, seq: nextSeq++ });
      await saveExpenses();
      $('f-name').value = '';
      $('f-amount').value = '';
      $('f-date').value = todayStr();
      renderAll();
    });

    $('entryBody').addEventListener('click', async (ev) => {
      const btn = ev.target.closest('[data-action="del-expense"]');
      if(!btn) return;
      const id = btn.getAttribute('data-id');
      expenses = expenses.filter(e => e.id !== id);
      await saveExpenses();
      renderAll();
    });

    document.querySelector('thead').addEventListener('click', (ev) => {
      const th = ev.target.closest('th[data-sort]');
      if(!th) return;
      const key = th.getAttribute('data-sort');
      if(sortKey === key){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortKey = key; sortDir = 'asc'; }
      renderTable();
    });

    $('filterRow').addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-filter]');
      if(!btn) return;
      activeFilter = btn.getAttribute('data-filter');
      renderFilterChips();
      renderTable();
      renderCategoryTotal();
    });

    $('monthTabs').addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-month]');
      if(!btn) return;
      activeMonth = btn.getAttribute('data-month');
      renderMonthTabs();
      renderTable();
      renderSummary();
      renderCategoryTotal();
      renderPivot();
      renderMoM();
    });

    $('catToggle').addEventListener('click', () => {
      $('catPanel').classList.toggle('open');
    });

    $('addCatBtn').addEventListener('click', async () => {
      const input = $('newCatInput');
      const val = input.value.trim();
      if(!val) return;
      if(categories.some(c => c.toLowerCase() === val.toLowerCase())){
        input.value = '';
        return;
      }
      categories.push(val);
      await saveCategories();
      input.value = '';
      renderAll();
    });

    $('newCatInput').addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter'){ ev.preventDefault(); $('addCatBtn').click(); }
    });

    $('catChipRow').addEventListener('click', async (ev) => {
      const btn = ev.target.closest('[data-action="del-cat"]');
      if(!btn) return;
      const cat = btn.getAttribute('data-cat');
      const inUse = expenses.some(e => e.category === cat);
      if(inUse){
        alert(`"${cat}" is used by existing entries. Reassign or delete those entries first, or rename via a new category instead.`);
        return;
      }
      if(categories.length <= 1){
        alert('You need at least one category.');
        return;
      }
      categories = categories.filter(c => c !== cat);
      if(activeFilter === cat) activeFilter = 'All';
      await saveCategories();
      renderAll();
    });

    $('loadSampleBtn').addEventListener('click', async () => {
      if(expenses.length > 0){
        const proceed = confirm('This will add sample entries alongside your existing data. You can delete them individually afterward. Continue?');
        if(!proceed) return;
      }
      const sample = getSampleExpenses();
      sample.forEach(e => expenses.push({ id: uid(), seq: nextSeq++, ...e }));
      await saveExpenses();
      renderAll();
    });

    $('exportBtn').addEventListener('click', () => {
      exportData();
    });

    $('exportCsvBtn').addEventListener('click', () => {
      if(expenses.length === 0){
        alert('There are no entries to export yet.');
        return;
      }
      exportCsv();
    });

    $('importBtn').addEventListener('click', () => {
      $('importFileInput').click();
    });

    $('importFileInput').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      ev.target.value = ''; // reset so selecting the same file again still fires 'change'
      if(!file) return;
      try{
        const text = await file.text();
        const parsed = JSON.parse(text);
        if(!parsed || !Array.isArray(parsed.expenses) || !Array.isArray(parsed.categories)){
          alert("This doesn't look like a valid Daily Ledger backup file.");
          return;
        }
        if(expenses.length > 0){
          const proceed = confirm(`This will replace your current ${expenses.length} entries and category list with the contents of this backup. This can't be undone. Continue?`);
          if(!proceed) return;
        }
        // Basic sanity-check + normalize each expense record; skip anything malformed
        const cleanExpenses = parsed.expenses
          .filter(e => e && typeof e.name === 'string' && !isNaN(parseFloat(e.amount)) && typeof e.date === 'string' && typeof e.category === 'string')
          .map((e, idx) => ({
            id: (typeof e.id === 'string' && e.id) ? e.id : uid(),
            name: e.name,
            amount: parseFloat(e.amount),
            date: e.date,
            category: e.category,
            // Preserve original add-order from the backup if present;
            // otherwise fall back to the file's listed order.
            seq: (typeof e.seq === 'number') ? e.seq : (idx + 1)
          }));
        const cleanCategories = parsed.categories.filter(c => typeof c === 'string' && c.trim());

        expenses = cleanExpenses;
        categories = cleanCategories.length ? cleanCategories : categories;
        nextSeq = expenses.reduce((m, e) => Math.max(m, e.seq || 0), 0) + 1;
        activeFilter = 'All';
        activeMonth = 'All';
        await saveExpenses();
        await saveCategories();
        renderAll();
        alert(`Import complete — loaded ${cleanExpenses.length} entries.`);
      }catch(err){
        alert("Couldn't read that file. Make sure it's a JSON backup exported from this tracker.");
      }
    });
  }

  // ---------- Export / Import ----------
  function exportData(){
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      expenses,
      categories
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `daily-ledger-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Escapes a single CSV field: wraps in quotes and doubles any inner quotes
  // whenever the value contains a comma, quote, or newline.
  function csvField(value){
    const s = String(value);
    if(/[",\n]/.test(s)){
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function exportCsv(){
    const rows = expenses.slice().sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    const header = ['Date', 'Expense Name', 'Category', 'Amount'];
    const lines = [header.map(csvField).join(',')];
    rows.forEach(e => {
      lines.push([
        e.date,
        csvField(e.name),
        csvField(e.category),
        parseFloat(e.amount).toFixed(2)
      ].join(','));
    });
    // Prefix with a BOM so Excel opens the UTF-8 file correctly instead of misreading special characters.
    const csvContent = '\uFEFF' + lines.join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `daily-ledger-export-${todayStr()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  (async function init(){
